project:
  name: ds-demand-forecasting
  random_seed: 42

paths:
  m5_dir: m5-forecasting-accuracy
  walmart_dir: archive
  processed_dir: data/processed
  prediction_dir: data/predictions
  output_dir: outputs

window:
  # overlap-only window between Walmart archive and M5
  start_date: 2011-01-29
  end_date: 2012-10-26

aggregation:
  level: dept_store_day

features:
  lag_days: [7, 14, 28]
  rolling_windows: [7, 28]

split:
  val_days: 28
  test_days: 28

models:
  sarima:
    seasonal_period: 7
    stepwise: true
    max_p: 2
    max_q: 2
    max_P: 1
    max_Q: 1
    max_d: 1
    max_D: 1
    maxiter: 25
    n_fits: 20
  prophet:
    yearly_seasonality: true
    weekly_seasonality: true
    regressors: [snap_flag, has_event, price_relative_to_mean]
  lightgbm:
    objective: regression
    metric: rmse
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    num_boost_round: 1500
    early_stopping_rounds: 100

evaluation:
  metrics: [rmse, mae, mape, smape]
  primary_metric: smape

business:
  holding_cost_annual_pct: 0.25
  margin_pct: 0.30
